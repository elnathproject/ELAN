<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f10">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Élan</title>
<style>
  :root { --bg:#0d0f10; --fg:#d9dedf; --muted:#7d8789; --line:#2a2f32; --count:#f2a541; --run:#9fe3d6; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"Roboto Condensed","Arial Narrow",system-ui,sans-serif; -webkit-user-select:none; user-select:none; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  #bar { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); min-height:18px; }
  #dot { width:9px; height:9px; border-radius:50%; background:#c33; flex:none; }
  #dot.on { background:#3c6; }
  #fit { flex:1; min-height:0; position:relative; }
  #digits { position:absolute; inset:0; width:100%; height:100%; display:block; }
  body.setup #digits, body.paused #digits { opacity:.45; }
  .flash { animation:flash .9s ease-out; }
  @keyframes flash { 0% { background:color-mix(in srgb, var(--count) 35%, transparent); } 100% { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { .flash { animation:none; } }
  /* first screen: one tap allows full screen, screen kept on and vibration */
  #gate { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:var(--bg); text-align:center; padding:24px; cursor:pointer; }
  #gate h1 { font:italic 400 52px Georgia,"Times New Roman",serif; color:var(--count); }
  #gate p { font-size:15px; line-height:1.5; color:var(--fg); max-width:30em; }
  #gate .tap { font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:14px 22px; }
  #gate .err { color:#e66; }
  [hidden] { display:none !important; }
</style>
</head>
<body class="setup">

<div id="gate">
  <h1>Élan</h1>
  <p id="gateMsg">The conductor controls this timer.</p>
  <div class="tap" id="gateTap">Tap to show the timer</div>
</div>

<div id="stage">
  <div id="bar"><i id="dot"></i><span id="label">Waiting for the conductor</span></div>
  <div id="fit"><canvas id="digits" role="img" aria-label="01:00"></canvas></div>
</div>

<script src="timer.js"></script>
<script src="display.js"></script>
</body>
</html>
